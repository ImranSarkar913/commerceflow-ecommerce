name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          {
            POSTGRES_USER: commerceflow,
            POSTGRES_PASSWORD: test-only-password,
            POSTGRES_DB: commerceflow_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U commerceflow -d commerceflow_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGDATABASE: commerceflow_test
      PGUSER: commerceflow
      PGPASSWORD: test-only-password
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://localhost:3002
      WEBHOOK_SECRET: test-only-signing-secret-at-least-32-characters
      COOKIE_SECURE: "false"
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: backend/package-lock.json,
          }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate
      - run: npm test
      - run: npm run test:integration
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
